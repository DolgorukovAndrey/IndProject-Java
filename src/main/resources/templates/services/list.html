<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Автомойки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Услуги</h1>
        <p class="subtitle">Управление услугами</p>
    </header>

    <!-- сообщения об успехе или ошибке -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- панель добавления -->
    <div class="action-panel">
        <a th:href="@{/}" class="btn btn-primary">Home</a>
        <a th:href="@{/services/newService}" class="btn btn-primary">+ Добавить услугу</a>
    </div>

    <div class="info-bar">
        <span>Всего услуг: <strong th:text="${serviceCount}">0</strong></span>
    </div>


    <div class="table-container">
        <table th:if="${serviceCount > 0}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название услуги</th>
                <th>Информация об услуге</th>
                <th class="actions-column">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="service : ${services}">
                <td th:text="${service.idService}">ID</td>
                <td th:text="${service.serviceName}">Название услуги</td>
                <td th:text="${service.serviceInfo}">Информация об услуге</td>
                <td class="actions">
                    <a th:href="@{/services/editService/{id}(id=${service.idService})}"
                       class="btn btn-small btn-edit" title="Редактировать">Изменить</a>
                    <a th:href="@{/services/deleteService/{id}(id=${service.idService})}"
                       class="btn btn-small btn-delete"
                       onclick="return confirm('Вы уверены, что хотите удалить эту услугу?')"
                       title="Удалить">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>


        <div th:if="${serviceCount == 0}" class="empty-state">
            <div class="empty-icon">🚗</div>
            <h2>Услуг пока нет</h2>
            <p>Начните добавлять услуги в вашу коллекцию</p>
            <a th:href="@{/services/newService}" class="btn btn-primary btn-large">Добавить первую услугу</a>
        </div>
    </div>
</div>
</body>
</html>
