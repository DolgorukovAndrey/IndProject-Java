<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${action == 'edit'} ? 'Редактировать услугу' : 'Добавить новую услугу'">Форма услуги</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1 th:text="${action == 'edit'} ? 'Редактировать услугу' : 'Добавить новую услугу'">Форма услуги</h1>
        <p class="subtitle">Заполните информацию об автомойке</p>
    </header>

    <div class="form-container">
        <form th:action="${action == 'edit'} ?
                         @{/services/updateService/{id}(id=${service.idService})} :
                         @{/services}"
              th:object="${service}"
              method="post"
              class="service-form">

<!--            название автомойки-->
            <div class="form-group">
                <label for="serviceName">Название услуги <span class="required">*</span></label>
                <input type="text"
                       id="serviceName"
                       th:field="*{serviceName}"
                       th:classappend="${#fields.hasErrors('serviceName')} ? 'error' : ''"
                       maxlength="200"
                       required>
                <span class="error-message" th:if="${#fields.hasErrors('serviceName')}" th:errors="*{serviceName}"></span>
            </div>

            <div class="form-group">
                <label for="serviceInfo">Информация об услуге <span class="required">*</span></label>
                <input type="text"
                       id="serviceInfo"
                       th:field="*{serviceInfo}"
                       th:classappend="${#fields.hasErrors('serviceInfo')} ? 'error' : ''"
                       required>
                <span class="error-message" th:if="${#fields.hasErrors('serviceInfo')}" th:errors="*{serviceInfo}"></span>
            </div>

<!--            кнопки действий-->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">
                    <span th:text="${action == 'edit'} ? 'Сохранить изменения' : 'Добавить услугу'"></span>
                </button>
                <a th:href="@{/services}" class="btn btn-secondary btn-large">Отмена</a>
            </div>

            <p class="form-note"><span class="required">*</span> Обязательные поля</p>
        </form>
    </div>
</div>
</body>
</html>
