<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${action == 'edit'} ? 'Редактировать автомойку' : 'Добавить новую автомойку'">Форма автомойки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1 th:text="${action == 'edit'} ? 'Редактировать автомойку' : 'Добавить новую автомойку'">Форма автомойки</h1>
        <p class="subtitle">Заполните информацию об автомойке</p>
    </header>

    <div class="form-container">
        <form th:action="${action == 'edit'} ?
                         @{/carwashs/updateCarwash/{id}(id=${carwash.idCarwash})} :
                         @{/carwashs}"
              th:object="${carwash}"
              method="post"
              class="carwash-form">

<!--            название автомойки-->
            <div class="form-group">
                <label for="carwashName">Название автомойки <span class="required">*</span></label>
                <input type="text"
                       id="carwashName"
                       th:field="*{carwashName}"
                       placeholder="Например: Автомойка24"
                       th:classappend="${#fields.hasErrors('carwashName')} ? 'error' : ''"
                       maxlength="200"
                       required>
                <span class="error-message" th:if="${#fields.hasErrors('carwashName')}" th:errors="*{carwashName}"></span>
            </div>

            <!--            адрес автомойки-->
            <div class="form-group">
                <label for="carwashAddress">Адрес автомойки <span class="required">*</span></label>
                <input type="text"
                       id="carwashAddress"
                       th:field="*{carwashAddress}"
                       th:classappend="${#fields.hasErrors('carwashAddress')} ? 'error' : ''"
                       maxlength="200"
                       required>
                <span class="error-message" th:if="${#fields.hasErrors('carwashAddress')}" th:errors="*{carwashAddress}"></span>
            </div>

<!--            кнопки действий-->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">
                    <span th:text="${action == 'edit'} ? 'Сохранить изменения' : 'Добавить автомойку'"></span>
                </button>
                <a th:href="@{/carwashs}" class="btn btn-secondary btn-large">Отмена</a>
            </div>

            <p class="form-note"><span class="required">*</span> Обязательные поля</p>
        </form>
    </div>
</div>
</body>
</html>
