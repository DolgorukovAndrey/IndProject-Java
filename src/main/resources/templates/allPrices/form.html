<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${action == 'edit'} ? 'Редактировать' : 'Добавить новую запись'">Форма услуги</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1 th:text="${action == 'edit'} ? 'Редактировать' : 'Добавить новую запись'">Форма услуги</h1>
        <p class="subtitle">Заполните информацию об автомойке</p>
    </header>

    <div class="form-container">
        <form th:action="${action == 'edit'} ?
                 @{/allPrices/updateAllPrice/{id}(id=${allPrice.id})} :
                 @{/allPrices}"
              method="post"
              class="service-form">

            <div class="form-group">
                <label class="form-label">Автомойка:</label>
                <select name="carwashName" class="form-control" id="carwashSelect" required>
                    <option value=""> Выберите автомойку </option>
                    <option th:each="carwash : ${carwashes}"
                            th:value="${carwash.carwashName}"
                            th:text="${carwash.carwashName} + ' (Адрес: ' + ${carwash.carwashAddress} + ')'"
                            th:attr="data-address=${carwash.carwashAddress}">
                    </option>
                </select>

                <input type="hidden" name="carwashAddress" id="carwashAddressInput">
            </div>

            <div class="form-group">
                <label class="form-label">Услуга:</label>
                <select name="service" class="form-control" id="serviceSelect" required>
                    <option value=""> Выберите услугу </option>
                    <option th:each="service : ${services}"
                            th:value="${service.serviceName}"
                            th:text="${service.serviceName}"
                            th:attr="data-info=${service.serviceInfo}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Информация об услуге:</label>
                <textarea name="serviceInfo" class="form-control" id="serviceInfoTextarea"
                          rows="1" placeholder="Будет заполнено автоматически при выборе услуги"
                          disabled></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Тип кузова:</label>
                <select name="bodytype" class="form-control">
                    <option value=""> Выберите тип кузова</option>
                    <option th:each="bodytype : ${bodytypes}"
                            th:value="${bodytype.bodytypeName}"
                            th:text="${bodytype.bodytypeName}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="leadTime">Время работы (в минутах)<span class="leadTime">*</span></label>
                <input type="number"
                       id="leadTime"
                       name="leadTime"
                       th:value="${allPrice.leadTime}"
                       min="0"
                       required>
            </div>

            <div class="form-group">
                <label for="price">Цена (в рублях)<span class="price">*</span></label>
                <input type="number"
                       id="price"
                       name="price"
                       th:value="${allPrice.price}"
                       min="0"
                       required>
            </div>

            <div class="form-group">
                <label for="priceDate">Дата установки цены <span class="priceDate">*</span></label>
                <input type="date"
                       id="priceDate"
                       name="priceDate"
                       th:value="${allPrice.priceDate}"
                       required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">
                    <span th:text="${action == 'edit'} ? 'Сохранить изменения' : 'Добавить запись'"></span>
                </button>
                <a th:href="@{/allPrices}" class="btn btn-secondary btn-large">Отмена</a>
            </div>

            <p class="form-note"><span class="required">*</span> Обязательные поля</p>
        </form>

        <script>
            document.getElementById('carwashSelect').addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                const address = selectedOption.getAttribute('data-address');
                document.getElementById('carwashAddressInput').value = address || '';
            });

            document.getElementById('serviceSelect').addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                const serviceInfo = selectedOption.getAttribute('data-info');
                document.getElementById('serviceInfoTextarea').value = serviceInfo || '';
            });
        </script>
    </div>
</div>
</body>
</html>
