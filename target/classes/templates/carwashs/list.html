<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Автомойки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Автомойки</h1>
        <p class="subtitle">Управление автомойками</p>
    </header>

    <!-- сообщения об успехе или ошибке -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- панель добавления -->
    <div class="action-panel">
        <a th:href="@{/}" class="btn btn-primary">Home</a>
        <a th:href="@{/carwashs/newCarwash}" class="btn btn-primary">+ Добавить автомойку</a>
    </div>

    <!-- информация о количестве типов кузова -->
    <div class="info-bar">
        <span>Всего автомоек: <strong th:text="${carwashCount}">0</strong></span>
    </div>

    <!-- таблица типов кузова -->
    <div class="table-container">
        <table th:if="${carwashCount > 0}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название автомойки</th>
                <th>Адрес автомойки</th>
                <th class="actions-column">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="carwash : ${carwashs}">
                <td th:text="${carwash.idCarwash}">ID</td>
                <td th:text="${carwash.carwashName}">Название автомойки</td>
                <td th:text="${carwash.carwashAddress}">Адрес автомойки</td>
                <td class="actions">
                    <a th:href="@{/carwashs/editCarwash/{id}(id=${carwash.idCarwash})}"
                       class="btn btn-small btn-edit" title="Редактировать">Изменить</a>
                    <a th:href="@{/carwashs/deleteCarwash/{id}(id=${carwash.idCarwash})}"
                       class="btn btn-small btn-delete"
                       onclick="return confirm('Вы уверены, что хотите удалить эту автомойку?')"
                       title="Удалить">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- сообщение, если типов кузова нет -->
        <div th:if="${carwashCount == 0}" class="empty-state">
            <div class="empty-icon">🚗</div>
            <h2>Автомоек пока нет</h2>
            <p>Начните добавлять автомойки в вашу коллекцию</p>
            <a th:href="@{/carwashs/newCarwash}" class="btn btn-primary btn-large">Добавить первую автомойку</a>
        </div>
    </div>
</div>
</body>
</html>
