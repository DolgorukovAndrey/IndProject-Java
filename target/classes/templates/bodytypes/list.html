<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Типы кузова</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Типы кузова</h1>
        <p class="subtitle">Управление типами кузова</p>
    </header>

    <!-- сообщения об успехе или ошибке -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- панель добавления -->
    <div class="action-panel">
        <a th:href="@{/}" class="btn btn-primary">Home</a>
        <a th:href="@{/bodytypes/newBodytype}" class="btn btn-primary">+ Добавить тип кузова</a>
    </div>

    <!-- информация о количестве типов кузова -->
    <div class="info-bar">
        <span>Всего типов кузова: <strong th:text="${bodytypeCount}">0</strong></span>
    </div>

    <!-- таблица типов кузова -->
    <div class="table-container">
        <table th:if="${bodytypeCount > 0}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название типа кузова</th>
                <th class="actions-column">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="bodytype : ${bodytypes}">
                <td th:text="${bodytype.idBodytype}">1</td>
                <td th:text="${bodytype.bodytypeName}">Седан</td>
                <td class="actions">
                    <a th:href="@{/bodytypes/editBodytype/{id}(id=${bodytype.idBodytype})}"
                       class="btn btn-small btn-edit" title="Редактировать">Изменить</a>
                    <a th:href="@{/bodytypes/deleteBodytype/{id}(id=${bodytype.idBodytype})}"
                       class="btn btn-small btn-delete"
                       onclick="return confirm('Вы уверены, что хотите удалить этот тип кузова?')"
                       title="Удалить">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- сообщение, если типов кузова нет -->
        <div th:if="${bodytypeCount == 0}" class="empty-state">
            <div class="empty-icon">🚗</div>
            <h2>Типов кузова пока нет</h2>
            <p>Начните добавлять типы кузова в вашу коллекцию</p>
            <a th:href="@{/bodytypes/newBodytype}" class="btn btn-primary btn-large">Добавить первый тип кузова</a>
        </div>
    </div>
</div>
</body>
</html>
