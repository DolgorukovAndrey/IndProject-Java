<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${action == 'edit'} ? 'Редактировать тип кузова' : 'Добавить тип кузова'">Форма типа кузова</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1 th:text="${action == 'edit'} ? 'Редактировать тип кузова' : 'Добавить новый тип кузова'">Форма типа кузова</h1>
        <p class="subtitle">Заполните информацию о типе кузова</p>
    </header>

    <div class="form-container">
        <form th:action="${action == 'edit'} ?
                         @{/bodytypes/updateBodytype/{id}(id=${bodytype.idBodytype})} :
                         @{/bodytypes}"
              th:object="${bodytype}"
              method="post"
              class="bodytype-form">

<!--            название альбома-->
            <div class="form-group">
                <label for="bodytype">Название типа кузова <span class="required">*</span></label>
                <input type="text"
                       id="bodytype"
                       th:field="*{bodytypeName}"
                       placeholder="Например: Седан"
                       th:classappend="${#fields.hasErrors('bodytypeName')} ? 'error' : ''"
                       maxlength="200"
                       required>
                <span class="error-message" th:if="${#fields.hasErrors('bodytypeName')}" th:errors="*{bodytypeName}"></span>
            </div>

<!--            кнопки действий-->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">
                    <span th:text="${action == 'edit'} ? 'Сохранить изменения' : 'Добавить тип кузова'"></span>
                </button>
                <a th:href="@{/bodytypes}" class="btn btn-secondary btn-large">Отмена</a>
            </div>

            <p class="form-note"><span class="required">*</span> Обязательные поля</p>
        </form>
    </div>
</div>
</body>
</html>
